plugins {
    id 'com.android.application'
}

android {
    namespace 'com.naivebasic'
    compileSdk 35

    defaultConfig {
        applicationId "com.naivebasic"
        minSdk 9
        targetSdk 10
        versionCode 99
        versionName "1.0"
    }

    lint {
        disable += "ExpiredTargetSdkVersion"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
